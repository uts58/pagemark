name: Publish

# Publishes to PyPI via Trusted Publishing — no API token is stored in this
# repo. Configure the publisher once at
# https://pypi.org/manage/account/publishing/ with:
#   owner: uts58   repo: pagemark   workflow: publish.yml   environment: pypi
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv build
      - name: twine check
        run: uv run --with twine python -m twine check dist/*
      # A tag that disagrees with __init__.__version__ would publish the wrong
      # version number, so fail before anything reaches PyPI.
      - name: tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(sed -n 's/^__version__ = "\(.*\)"$//p' src/pagemark/__init__.py)"
          echo "tag=$tag package=$pkg"
          test -n "$pkg" && test "$tag" = "$pkg"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
